name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v pod >/dev/null || brew install cocoapods

      - name: Generate Xcode workspace
        run: |
          xcodegen generate
          pod install

      - name: Build for physical iPhone without signing
        run: |
          xcodebuild \
            -workspace ComicBrowser.xcworkspace \
            -scheme ComicBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ComicBrowserDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate and package unsigned IPA
        run: |
          app="$RUNNER_TEMP/ComicBrowserDerivedData/Build/Products/Release-iphoneos/ComicBrowser.app"
          plist="$app/Info.plist"
          test -d "$app"
          test -f "$plist"

          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          test -n "$executable"
          test -n "$version"
          test -n "$build"
          test -f "$app/$executable"
          /usr/bin/lipo -verify_arch arm64 "$app/$executable"
          echo "Packaging $executable version $version ($build), arm64"

          mkdir -p "$RUNNER_TEMP/ComicBrowserIPA/Payload"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/ComicBrowserIPA/Payload/ComicBrowser.app"
          cd "$RUNNER_TEMP/ComicBrowserIPA"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/ios/ComicBrowser-unsigned.ipa" Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicBrowser-unsigned-ipa
          path: ios/ComicBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
